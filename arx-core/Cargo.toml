[package]
name = "arx-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
description = "ARXOS native package-manager core: libalpm sync/query + concurrent ARX repo sync"
license = "GPL-3.0-or-later"

[[bin]]
name = "arx-core"
path = "src/main.rs"

[dependencies]
alpm = { version = "4", features = ["generate"] }
alpm-utils = "4"
pacmanconf = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "process", "sync", "time"] }
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
